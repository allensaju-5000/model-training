[project]
name = "model-training"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fiftyone>=1.22.1",
    "pillow>=12.3.0",
    "pyyaml>=6.0.3",
    "rfdetr[loggers,onnx,train]>=1.12.1",
    "rich>=15.0.0",
    "typer>=0.25.1",
    "ultralytics>=8.4.175",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "notebook>=7.6.3",
]

[project.scripts]
kiln = "kiln.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kiln"]
